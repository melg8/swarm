# golangci-lint v2 configuration, migrated from v1 (2026-09-08,
# golangci-lint migrate, comments restored by hand). The v1 backup is
# .golangci.bck.yml. The set mirrors the strict v1 configuration: the
# merged v2 linters (gosimple, stylecheck -> staticcheck) and the v2
# default set (errcheck, govet, ineffassign, staticcheck, unused) cover
# the v1 entries that no longer exist as separate linters.
version: "2"

run:
  tests: true

linters:
  enable:
    - asasalint     # Checks for pass []any as any in variadic position
    - bodyclose     # Checks whether HTTP response body is properly closed
    - containedctx  # Detects struct contained context.Context field
    - cyclop        # Function complexity
    - dogsled       # Checks assignments with too many blank identifiers
    - dupl          # Tool for code clone detection
    - errorlint     # Error wrapping scheme problems
    - exhaustive    # Exhaustiveness of enum switch statements
    - exhaustruct   # All struct fields must be initialized (the v5 major rename is a planned follow-up)
    - forbidigo     # Forbids identifiers
    - funlen        # Function length
    - goconst       # Repeated strings that could be replaced by a constant
    - gocritic      # Extensive code analysis
    - gocyclo       # Function complexity
    - godot         # Comments end in a period
    - gosec         # Security problems
    - inamedparam   # Interface method parameters must be named
    - intrange      # for i := 0; i < n; i++ -> for i := range n
    - ireturn       # Interfaces as return types
    - lll           # Line length
    - makezero      # Slice declarations with non-zero initial length
    - misspell      # Commonly misspelled words in comments
    - nakedret      # Naked returns in long functions
    - nilerr        # Redundant nil checks on errors
    - nilnil        # No simultaneous return of nil error and nil value
    - nlreturn      # Blank line before return
    - noctx         # HTTP requests without context.Context
    - nolintlint    # Ill-formed nolint directives
    - perfsprint    # fmt.Sprintf replacements with faster alternatives
    - prealloc      # Slice declarations that could be preallocated
    - predeclared   # Code that shadows predeclared identifiers
    - reassign      # Package variables must not be reassigned
    - revive        # Fast, configurable, extensible linter
    - staticcheck   # State of the art linter (v2: merged gosimple/stylecheck)
    - testifylint   # testify assertion style
    - thelper       # Test helpers must call t.Helper()
    - tparallel     # Inappropriate t.Parallel() usage
    - unconvert     # Unnecessary type conversions
    - unparam       # Unused function parameters
    - usetesting    # os.Setenv in tests -> t.Setenv (the v2 replacement of tenv)
    - wastedassign  # Wasted assignment statements
    - whitespace    # Whitespace issues

  disable:
    - depguard      # Enable if need to vet dependencies
    - mnd
    - paralleltest  # Enable for t.Parallel() checks.
    - varnamelen
    - wsl
    - wrapcheck
    # planned to fix:
    - err113
    - testpackage

  settings:
    cyclop:
      # 10 (the default) flags every linear wire-format field dispatch
      # and per-attribute apply switch of the protocol layers; 15 keeps
      # the genuinely tangled functions visible. gocyclo is not enabled:
      # it duplicated cyclop with a looser threshold.
      max-complexity: 15
    funlen:
      # 60/40 (the defaults) flag the wire-format parsers and the trip
      # phase handlers one or two statements over the line; 65/45 keeps
      # the genuinely long bodies visible.
      lines: 65
      statements: 45
    goconst:
      min-len: 3
    gosec:
      # G115 (integer overflow conversions) is the bread and butter of a
      # binary protocol parser: every wire field read is a bounded value
      # converted into a Go integer type, the packet parsers guard the
      # implausible values with explicit capacity checks, and the whole
      # layer is covered by parser tests. Flagging every conversion drowns
      # the signal; real overflow risks in non-protocol code stay covered
      # by the remaining gosec checks.
      excludes:
        - G115
    exhaustruct:
      # net.Dialer carries deprecated fields: listing them all for the
      # explicit-initialization convention trips staticcheck SA1019.
      exclude:
        - "^net\\.Dialer$"
    exhaustive:
      # A switch with a default case explicitly handles the remaining
      # values; demanding every enum member listed there too would only
      # duplicate the default.
      default-signifies-exhaustive: true
    lll:
      line-length: 80

  exclusions:
    # The presets replicate the v1 default exclusions (the migration
    # generated them to keep the old behavior).
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: cmd/geotest/
        linters:
          # The geotest CLI tool prints its findings to stdout by design.
          - forbidigo
      - path: _test\.go
        linters:
          - errcheck
          # Test fixtures legitimately repeat literal names ("Gremlin"
          # fourteen times reads better than a constant) and construct
          # partial structs to exercise single fields; test requests
          # without context are the httptest default. Test functions
          # are linear scenario scripts (long fixture tables, long
          # expected vectors, extra blank identifiers in helper calls,
          # growing scenario bodies) where the style limits of the
          # production code do not aid the reader. The production rules
          # stay strict.
          - dogsled
          - exhaustruct
          - funlen
          - goconst
          - lll
          - noctx
          - prealloc
    paths:
      - vendor
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
    - gofumpt
    - gci
    - goimports
  exclusions:
    generated: lax
    paths:
      - vendor
      - third_party$
      - builtin$
      - examples$
