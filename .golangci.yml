# golangci-lint v2 configuration, migrated from v1 (2026-09-08,
# golangci-lint migrate, comments restored by hand). The v1 backup is
# .golangci.bck.yml. The set mirrors the strict v1 configuration: the
# merged v2 linters (gosimple, stylecheck -> staticcheck) and the v2
# default set (errcheck, govet, ineffassign, staticcheck, unused) cover
# the v1 entries that no longer exist as separate linters.
version: "2"

run:
  tests: true
  # Show every finding (the defaults cap the identical ones at 3 and
  # each linter at 50): the caps hide the tail of a debt cleanup
  # behind artificial round limits, the gate must see the full list.
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  enable:
    - asasalint     # Checks for pass []any as any in variadic position
    - bodyclose     # Checks whether HTTP response body is properly closed
    - containedctx  # Detects struct contained context.Context field
    - cyclop        # Function complexity
    - dogsled       # Checks assignments with too many blank identifiers
    - dupl          # Tool for code clone detection
    - errorlint     # Error wrapping scheme problems
    - exhaustive    # Exhaustiveness of enum switch statements
    - exhaustruct_v5 # All struct fields must be initialized (the v5
                     # major of exhaustruct; the v1 entry is deprecated
                     # since golangci-lint v2.13.0). The nolint
                     # directive is //nolint:exhaustruct_v5.
    - forbidigo     # Forbids identifiers
    - funlen        # Function length
    - goconst       # Repeated strings that could be replaced by a constant
    - gocognit      # Cognitive complexity (the human-readability twin of cyclop)
    - gocritic      # Extensive code analysis
    - godot         # Comments end in a period
    - gosec         # Security problems
    - inamedparam   # Interface method parameters must be named
    - intrange      # for i := 0; i < n; i++ -> for i := range n
    - ireturn       # Interfaces as return types
    - lll           # Line length
    - maintidx      # Maintainability index (Halstead + cyclomatic + loc)
    - makezero      # Slice declarations with non-zero initial length
    - misspell      # Commonly misspelled words in comments
    - nakedret      # Naked returns in long functions
    - nilerr        # Redundant nil checks on errors
    - nilnil        # No simultaneous return of nil error and nil value
    - nlreturn      # Blank line before return
    - noctx         # HTTP requests without context.Context
    - nolintlint    # Ill-formed nolint directives
    - perfsprint    # fmt.Sprintf replacements with faster alternatives
    - prealloc      # Slice declarations that could be preallocated
    - predeclared   # Code that shadows predeclared identifiers
    - reassign      # Package variables must not be reassigned
    - revive        # Fast, configurable, extensible linter
    - staticcheck   # State of the art linter (v2: merged gosimple/stylecheck)
    - testifylint   # testify assertion style
    - thelper       # Test helpers must call t.Helper()
    - tparallel     # Inappropriate t.Parallel() usage
    - unconvert     # Unnecessary type conversions
    - unparam       # Unused function parameters
    - usetesting    # os.Setenv in tests -> t.Setenv (the v2 replacement of tenv)
    - wastedassign  # Wasted assignment statements
    - whitespace    # Whitespace issues

  disable:
    - depguard      # Enable if need to vet dependencies
    - mnd
    - paralleltest  # Enable for t.Parallel() checks.
    - varnamelen
    - wsl
    - wrapcheck
    # planned to fix:
    - err113
    - testpackage

  settings:
    cyclop:
      # 10 (the default) flags every linear wire-format field dispatch
      # and per-attribute apply switch of the protocol layers; 15 keeps
      # the genuinely tangled functions visible. gocyclo is not enabled:
      # it duplicated cyclop with a looser threshold.
      max-complexity: 15
    funlen:
      # 60/40 (the defaults) flag the wire-format parsers and the trip
      # phase handlers one or two statements over the line; 65/45 keeps
      # the genuinely long bodies visible.
      lines: 65
      statements: 45
    gocognit:
      # The cognitive complexity twin of cyclop: cyclop counts branches,
      # gocognit counts nesting and human-readable cognitive load. 30 (the
      # default) flags nothing; 25 surfaces the six hunt-loop decision
      # functions that read as one decision tree each (engage, the tick
      # phase handlers, the delevel guard). The flagged functions carry
      # a //nolint:gocognit directive with a refactor note until they
      # split.
      min-complexity: 25
    goconst:
      min-len: 3
    maintidx:
      # The maintainability index (Halstead volume + cyclomatic + loc,
      # scaled 0-100, higher is better). 20 (the default) surfaces the
      # engage function of the hunt loop (MI 11) and the proxy E2E test
      # (MI 19); both are the refactor candidates the gocognit finding
      # already names. The flagged functions carry a //nolint:maintidx
      # directive with a refactor note.
      under: 20
    gosec:
      # G115 (integer overflow conversions) is the bread and butter of a
      # binary protocol parser: every wire field read is a bounded value
      # converted into a Go integer type, the packet parsers guard the
      # implausible values with explicit capacity checks, and the whole
      # layer is covered by parser tests. Flagging every conversion drowns
      # the signal; real overflow risks in non-protocol code stay covered
      # by the remaining gosec checks.
      excludes:
        - G115
    exhaustruct_v5:
      # The v5 linter matches types by a regexp over the full type
      # path (package.Type); the v1 'exclude' field is replaced by
      # 'ignore-patterns' (and 'enforce-patterns' for opt-in mode).
      # The list below carries the deliberate partial inits of the
      # codebase: the empty answers where the zero value IS the
      # documented "nothing" (the not found Result, the zero Pos),
      # the option and stat aggregates where the zero value is the
      # default, and the internal build/query state whose
      # constructors fill the fields the pass needs and leave the
      # rest at their documented zero values. A site that needs a
      # non zero start sets it explicitly next to the literal. The
      # production case that predates the list: net.Dialer carries
      # deprecated fields, handled by a local //nolint:exhaustruct_v5
      # directive with the documented reason (staticcheck SA1019) -
      # a global ignore for it would mask a real miss in any other
      # package that aliased net.Dialer.
      ignore-patterns:
        # The empty answers.
        - .*pathfind\.Result$
        - .*navmesh\.Pos$
        - .*navmesh\.Filter$
        - .*navmesh\.Route$
        - .*navmesh\.TileGrid$
        - .*state\.Snapshot$
        - .*acceptance\.characterReset$
        - .*acceptance\.fullDressWatch$
        # The option and stat aggregates.
        - .*navbuild\.Options$
        - .*navbuild\.BuildStats$
        - .*navbuild\.PackStats$
        - .*navbuild\.packCounters$
        - .*navbuild\.tileUpgrade$
        # The internal build and query state.
        - .*navbuild\.sheets$
        - .*pathfind\.Engine$
        - .*pathfind\.layerPool$
        - .*hunt\.Loop$
        - .*connection\.GameClient$
        - .*navmesh\.Mesh$
        - .*navmesh\.Tile$
        - .*navmesh\.regionAbstract$
        - .*navmesh\.abstractEdge$
        - .*navmesh\.abstractEdgeRef$
        - .*navmesh\.coarseNode$
        - .*navmesh\.coarseResult$
        - .*navmesh\.hierQuery$
        - .*navmesh\.queryState$
        - .*navmesh\.tileCall$
    exhaustive:
      # A switch with a default case explicitly handles the remaining
      # values; demanding every enum member listed there too would only
      # duplicate the default.
      default-signifies-exhaustive: true
    lll:
      line-length: 80

  exclusions:
    # The presets replicate the v1 default exclusions (the migration
    # generated them to keep the old behavior).
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: cmd/(geotest|navanalyze|navmesh-build)/
        linters:
          # The geotest, navanalyze and navmesh-build CLI tools print
          # their findings to stdout by design.
          - forbidigo
          # The analysis drivers are linear scratch benches over the
          # shipped artifacts: the whole body IS the scenario.
          - cyclop
          - funlen
          - gocognit
          - maintidx
      - path: (cmd/navmesh-export|tools/repro_gamepath|tools/repro_rawpath|scripts/(geo_diag|geo_repair|tailcheck))\.go$|^(cmd/navmesh-export|tools/repro_gamepath|tools/repro_rawpath|scripts/(geo_diag|geo_repair|tailcheck))/
        linters:
          # The navmesh export driver, the gamepath and rawpath
          # replay probes and the geodata scratch tools share the
          # analysis-driver nature: they print by design, take raw
          # paths from argv (the taint check of a local scratch tool
          # flags the ordinary flag machinery), and the long data
          # tables exceed the line budget. Relief matches the
          # geotest/navanalyze/navmesh-build rule above plus the
          # gosec paths and the layout linters their one-shot bodies
          # trip.
          - forbidigo
          - cyclop
          - funlen
          - gocognit
          - maintidx
          - gosec
          - lll
          - nlreturn
          - intrange
      - path: internal/swarm/pathfind/navmesh/c1_waterzones\.go
        linters:
          # The C1 water zone table is one zone per line by design:
          # every entry is the six world bounds plus the source
          # comment, and the column layout is the readable form of
          # the dataset (wrapping each zone over two lines would
          # double the table height and hide the overlaps the
          # queries reason about).
          - lll
      - path: _test\.go
        linters:
          - errcheck
          # Test fixtures legitimately repeat literal names ("Gremlin"
          # fourteen times reads better than a constant) and construct
          # partial structs to exercise single fields; test requests
          # without context are the httptest default. Test functions
          # are linear scenario scripts (long fixture tables, long
          # expected vectors, extra blank identifiers in helper calls,
          # growing scenario bodies) where the style limits of the
          # production code do not aid the reader. cyclop joins for
          # the same reason: a test that walks every seam column pair
          # is one long decision script, not a tangled function. The
          # production rules stay strict.
          - cyclop
          - dogsled
          - exhaustruct_v5
          - funlen
          - goconst
          - gocognit
          - lll
          - maintidx
          - noctx
          - prealloc
    paths:
      - vendor
      - third_party$
      - builtin$
      - examples$

formatters:
  # Spaces only (see AGENTS.md): the stock gofmt, gofumpt and
  # goimports all re-tab the tree, so the formatter of record is the
  # repository tool cmd/gofmt-spaces (`task fmt`, gated by
  # `task fmt:check`). gci joins the disable list for the same
  # reason: its canonical form is tab-indented, so it flags every
  # spaces-only file that a diff marks as new (observed 2026-09-19:
  # gci "File is not properly formatted" on any fresh spaces-only
  # file). Import grouping stays with gofmt-spaces and review.
  enable: []
  disable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - vendor
      - third_party$
      - builtin$
      - examples$
