---
version: '3'

tasks:
  default:
    cmds:
      - task --list --sort=alphanumeric

  check:all:
    desc: Alias of verify (build, vet, lint, test, fmt:check)
    aliases: [all]
    deps: [verify]

  verify:
    desc: The full gate - build, vet, lint, test, fmt:check (the CI gate; the skill order, no step skipped)
    aliases: [v]
    deps: [build, vet, lint, test, fmt:check]

  build:
    desc: Compiles everything including cmd/
    aliases: [b]
    cmds:
      - go build ./...

  vet:
    desc: Runs go vet (the cheap static checks)
    cmds:
      - go vet ./...

  fmt:
    desc: Formats the tree with spaces only (gofmt-spaces)
    cmds:
      - go run ./cmd/gofmt-spaces -w . .agents/skills
      - bash tools/normalize_whitespace.sh

  fmt:check:
    desc: Fails when a file still contains a tab
    cmds:
      - |
        out="$(go run ./cmd/gofmt-spaces -l . .agents/skills)"
        if [ -n "$out" ]; then
          echo "Error unformatted go files (run task fmt):" >&2
          echo "$out" >&2
          exit 1
        fi
      - |
        if git grep -IlP '\t' -- .; then
          echo "Error tracked text files still contain tabs (run task fmt)" >&2
          exit 1
        fi

  git:discard:
    desc: Discards unstaged changes
    aliases: [discard]
    cmds:
      - git checkout -- .

  lint:
    desc: Runs golangci-lint
    aliases: [l]
    sources:
      - './**/*.go'
      - .golangci.yml
    cmds:
      - golangci-lint run

  lint:new:
    desc: Runs golangci-lint
    aliases: [ln]
    sources:
      - './**/*.go'
      - .golangci.yml
    cmds:
      - golangci-lint run --new

  lint:fix:
    desc: Runs golangci-lint and fixes any issues
    aliases: [lf]
    sources:
      - './**/*.go'
      - .golangci.yml
    cmds:
      - golangci-lint run --fix

  lint:show:
    desc: Shows enabled and disabled linters
    aliases: [ls]
    cmds:
      - golangci-lint linters

  packages:
    desc: Shows list of packages
    aliases: [p]
    cmds:
      - go list ./...

  run:app:
    desc: Runs application
    aliases: [r]
    cmds:
      # The package path form (not ./cmd/swarm/main.go): a file path
      # build compiles the command-line-arguments package and Go
      # embeds no VCS stamp into it - the build identity of the state
      # dump would lose the commit.
      - go run ./cmd/swarm

  test:
    desc: Runs test suite
    aliases: [t]
    cmds:
      - go test ./...

  test:race:
    desc: Runs the test suite under the race detector (needs cgo/gcc, the race tests of connection and pathfind target the 2026-09-08 send and layer pool races)
    aliases: [tr]
    cmds:
      - CGO_ENABLED=1 go test ./... -race -count=1

  test:cover:
    desc: Test suite with coverage, the per package delta against runs/coverage-latest.txt (fails on a drop beyond COVER_DROP_LIMIT, default 2.0 pp)
    aliases: [tc]
    cmds:
      - bash tools/coverage_delta.sh

  bench:save:
    desc: Saves the benchmark baseline of PKG into runs/bench-<name>.txt (commit it; tools/bench_save.sh)
    cmds:
      - bash tools/bench_save.sh {{.PKG}}

  bench:diff:
    desc: Compares two benchmark outputs (cmd/benchdiff, the offline benchstat) - BASE=runs/bench-<name>.txt NEW=<fresh run>
    cmds:
      - go run ./cmd/benchdiff -base {{.BASE}} -new {{.NEW}}

  prepush:
    desc: The fast pre-push gate - build, vet, lint --new, whitespace, the tests of the touched packages (tools/prepush.sh; mandatory before every push)
    cmds:
      - bash tools/prepush.sh

  progress:
    desc: Regenerates PROGRESS.md from the live sources (the ladder, the metrics, the commits)
    aliases: [pr]
    cmds:
      - bash tools/progress_report.sh

  repro:hud:
    desc: Runs the character HUD reproduction harness
    aliases: [reph]
    cmds:
      - node tools/repro_hud.js

  repro:map:
    desc: Runs the web map target link and marker harness
    aliases: [repmap]
    cmds:
      - node tools/repro_map_render.js

  repro:movement:
    desc: Runs the web map movement reproduction harness
    aliases: [repm]
    cmds:
      - node tools/repro_movement.js

  repro:gear:
    desc: Runs the equipment widget reproduction harness
    aliases: [repg]
    cmds:
      - node tools/repro_gear.js

  generate:system-messages:
    desc: Regenerates the system message dictionary from the Mobius sources
    aliases: [gensm]
    cmds:
      - bash tools/generate_system_messages.sh

  generate:skills:
    desc: Regenerates the skill tree dictionary from the Mobius sources
    aliases: [genskills]
    cmds:
      - bash tools/generate_skill_trees.sh

  tidy:
    desc: Runs go mod tidy
    cmds:
      - go mod tidy
