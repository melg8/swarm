[package]
name = "swarm-navmesh"
version = "0.1.0"
edition = "2021"
description = "Rust port of the swarm navmesh pathfinding runtime (Detour-style tile mesh, HNA* hierarchy, funnel)"
license = "MIT"

[dependencies]
zstd = "0.13"
flate2 = "1"
crc32fast = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = false
opt-level = 3
